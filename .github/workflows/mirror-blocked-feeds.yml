name: Mirror blocked feeds

# Free stand-in for AISource feeds whose site blocks the Django server's own
# IP (Cloudflare edge reputation - see feeds/README.md). Fetches each feed
# from GitHub's network instead, and publishes the result to the
# feeds-mirror branch as a single force-pushed commit (no history growth).
# AISource.url for an affected source then points at the
# raw.githubusercontent.com copy instead of the real site.
#
# The list of feeds to mirror is pulled live from the dashboard
# (mirrored_feeds_config_api_view) every run, so adding a source from
# السيستم والعمليات > المصادر المحظورة takes effect on the next run with no
# deploy needed. feeds/mirror-config.json is only the offline fallback if
# that endpoint can't be reached.
#
# To add a newly-blocked source: use the dashboard (preferred), or add
# {"name", "url", "output"} to feeds/mirror-config.json directly as a
# fallback entry.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://sahafihub.com' }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull the live feed list from the dashboard (falls back to the committed file)
        run: |
          live=$(curl -sL --max-time 15 "$SITE_BASE_URL/ai-dashboard/api/mirrored-feeds-config/" || true)
          if echo "$live" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "$live" > feeds/mirror-config.json
            echo "Using live config from the dashboard ($(echo "$live" | jq 'length') source(s))"
          else
            echo "::warning::Could not reach the live dashboard config - using the committed feeds/mirror-config.json instead"
          fi

      - name: Restore last-published copies (checkout never has them - they only live on feeds-mirror)
        run: |
          git fetch origin feeds-mirror --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/feeds-mirror >/dev/null 2>&1; then
            jq -r '.[].output' feeds/mirror-config.json | while read -r out; do
              # `git show ... > "$out"` would create/truncate "$out" to an
              # empty file even when the path doesn't exist on feeds-mirror
              # yet (redirection happens before git show runs, regardless of
              # whether it succeeds) - confirmed as the cause of a newly
              # mirrored source publishing as a 0-byte file when its first
              # live fetch also failed. Check the path exists first instead.
              if git cat-file -e "origin/feeds-mirror:$out" 2>/dev/null; then
                mkdir -p "$(dirname "$out")"
                git show "origin/feeds-mirror:$out" > "$out"
              fi
            done
          fi

      - name: Fetch every configured feed (keep last-good copy on failure)
        run: |
          set -euo pipefail
          jq -c '.[]' feeds/mirror-config.json | while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            url=$(echo "$entry" | jq -r '.url')
            out=$(echo "$entry" | jq -r '.output')
            mkdir -p "$(dirname "$out")"
            tmp=$(mktemp)
            if curl -sL --max-time 20 \
                 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" \
                 "$url" -o "$tmp" \
               && [ -s "$tmp" ] \
               && grep -qi "<rss\|<feed\|<urlset\|<?xml" "$tmp"; then
              cp "$tmp" "$out"
              echo "OK: $name"
            else
              echo "::warning::Fetch failed or invalid for $name ($url) - keeping previous mirror"
            fi
            rm -f "$tmp"
          done

      - name: Publish to feeds-mirror branch (single commit, no history growth)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan feeds-mirror-tmp
          git rm -rf --cached . >/dev/null
          git add feeds/mirror-config.json
          # Only add non-empty outputs - a source with no successful fetch
          # ever (brand new, or first run before feeds-mirror existed) has
          # nothing to restore or publish yet. -s (not just -f) as a second
          # guard against ever publishing a 0-byte file again.
          jq -r '.[].output' feeds/mirror-config.json | while read -r out; do
            [ -s "$out" ] && git add "$out"
          done
          git commit -m "Mirror feeds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin feeds-mirror-tmp:feeds-mirror
