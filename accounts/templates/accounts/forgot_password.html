{% extends 'landing/base.html' %}
{% block content %}
<div class="container" style="max-width: 460px; padding: 4rem 1rem;">
    <div class="panel panel-accent">
        <h2 class="text-center" style="margin-bottom: 0.5rem;">نسيت كلمة السر؟</h2>
        <p style="color: var(--muted); margin-bottom: 1rem;" class="text-center">أدخل بريدك الإلكتروني المسجل، وهنبعتلك كود لإعادة تعيين كلمة السر.</p>
        <form method="post" action="{% url 'accounts:forgot_password' %}" style="display: flex; flex-direction: column; gap: 1.25rem;">
            {% csrf_token %}
            <div class="field">
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">إرسال الكود</button>
        </form>
        <p class="text-center" style="margin-top: 1rem; color: var(--muted);"><a href="{% url 'accounts:login' %}">رجوع لتسجيل الدخول</a></p>
    </div>
</div>
{% endblock %}
