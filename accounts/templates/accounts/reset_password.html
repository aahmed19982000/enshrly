{% extends 'landing/base.html' %}
{% block content %}
<div class="container" style="max-width: 460px; padding: 4rem 1rem;">
    <div class="panel panel-accent">
        <h2 class="text-center" style="margin-bottom: 0.5rem;">إعادة تعيين كلمة السر</h2>
        <p style="color: var(--muted); margin-bottom: 1rem;" class="text-center">أدخل الكود اللي وصلك بالإيميل، وكلمة السر الجديدة.</p>
        <form method="post" action="{% url 'accounts:reset_password' %}" style="display: flex; flex-direction: column; gap: 1.25rem;">
            {% csrf_token %}
            <div class="field">
                <label>الكود</label>
                <input type="text" name="otp_code" required maxlength="6">
            </div>
            <div class="field">
                <label>كلمة السر الجديدة</label>
                <input type="password" name="new_password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">تغيير كلمة السر</button>
        </form>
        <p class="text-center" style="margin-top: 1rem; color: var(--muted);"><a href="{% url 'accounts:forgot_password' %}">لم يصل شيء؟ إعادة الإرسال</a></p>
    </div>
</div>
{% endblock %}
