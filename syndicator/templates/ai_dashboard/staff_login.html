<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة - المغرب اليوم</title>

    <!-- Google Fonts (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN for premium utilities) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        },
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f1f5f9;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-glow {
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm">
        <div class="flex items-center justify-center space-x-3 space-x-reverse mb-8">
            <div class="p-2.5 bg-gradient-to-tr from-primary-600 to-teal-400 rounded-xl shadow-lg shadow-teal-500/20">
                <i class="fa-solid fa-robot text-2xl text-white"></i>
            </div>
            <div class="text-center">
                <h1 class="text-lg font-bold tracking-tight text-white">بوابة الذكاء الاصطناعي</h1>
                <span class="text-xs text-primary-500 font-semibold uppercase tracking-wider">لوحة إدارة النظام</span>
            </div>
        </div>

        <div class="glass-panel p-8 rounded-2xl">
            <h2 class="text-lg font-bold text-white mb-6 text-center">تسجيل دخول فريق الإدارة</h2>

            {% if messages %}
            <div class="space-y-3 mb-6">
                {% for message in messages %}
                <div class="p-3 rounded-xl flex items-center space-x-2 space-x-reverse border text-sm {% if message.tags == 'success' %}bg-emerald-950/40 border-emerald-800 text-emerald-400{% elif message.tags == 'error' %}bg-rose-950/40 border-rose-800 text-rose-400{% else %}bg-blue-950/40 border-blue-800 text-blue-400{% endif %}">
                    <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check{% elif message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-info{% endif %}"></i>
                    <p class="font-medium">{{ message }}</p>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="space-y-2">
                    <label for="id_username" class="block text-sm font-semibold text-slate-300">اسم المستخدم</label>
                    <input type="text" name="username" id="id_username" required autofocus class="block w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-slate-200 transition duration-150" placeholder="اسم المستخدم">
                </div>

                <div class="space-y-2">
                    <label for="id_password" class="block text-sm font-semibold text-slate-300">كلمة المرور</label>
                    <input type="password" name="password" id="id_password" required class="block w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-slate-200 transition duration-150" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-glow w-full px-6 py-3 bg-gradient-to-r from-primary-600 to-teal-500 hover:from-primary-700 hover:to-teal-600 text-white text-sm font-semibold rounded-xl transition duration-150">تسجيل الدخول</button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-600 mt-6">هذه الصفحة مخصّصة لفريق الإدارة فقط. للعملاء، الرجاء <a href="/auth/login/" class="text-teal-500 hover:text-teal-400">تسجيل الدخول من هنا</a>.</p>
    </div>

</body>
</html>
